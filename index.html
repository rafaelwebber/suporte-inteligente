<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar</title>
  <link rel="stylesheet" href="style.css">
  <script>
    (function () {
      var t = localStorage.getItem("theme");
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body data-page="login">
  <main class="login">
    <form id="login-form" novalidate>
      <h1>Entrar</h1>
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Senha</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <p class="error" id="login-error" role="alert"></p>
      <button class="primary" id="login-btn" type="submit">Entrar</button>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Alternar tema">
        <svg class="theme-icon-moon" viewBox="0 0 24 24"><path d="M21 14.5A8.5 8.5 0 019.5 3 7 7 0 1019 16.5c.7-.6 1.3-1.3 2-2z"/></svg>
        <svg class="theme-icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span class="theme-label-dark">Tema claro</span>
        <span class="theme-label-light">Tema escuro</span>
      </button>
    </form>
  </main>
  <script src="app.js"></script>
</body>
</html>
